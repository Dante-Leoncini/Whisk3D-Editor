apply plugin: 'com.android.application'

// Version = fecha de compilacion YY.MM.DD (mismo criterio que el .deb / .exe).
def buildDate = new Date().format('yy.MM.dd')
// El NUMERO de version (versionCode) tambien sale de la fecha: Google Play pide que crezca en cada subida (antes era
// siempre 1). yyMMddHH y un digito mas con los minutos de a 6 (dos AAB en la misma hora no repiten el numero):
// 261112004 = 12/11/26 a las 00:24. Entra de sobra en el maximo (2100000000).
def ahora = new Date()
def buildCode = Integer.parseInt(ahora.format('yyMMddHH')) * 10 + Integer.parseInt(ahora.format('mm')).intdiv(6)
// EL AAB DE GOOGLE PLAY (bundleRelease) pide Android 7.0 (API 24) como minimo: lo exige la proteccion automatica de
// Play. El APK de la pagina (assembleDebug) sigue desde Android 5.0 (API 21).
def paraPlay = gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') }

// LA CLAVE DE SUBIDA a Google Play: Play no acepta nada firmado con la clave de debug. La clave y sus contrasenias
// son PRIVADAS y no estan en el repo: las da ~/.gradle/gradle.properties (W3D_SUBIDA_*). Sin ellas, el release se
// firma con la de debug como antes (sirve para probar, no para Play).
def hayClaveSubida = project.hasProperty('W3D_SUBIDA_STORE_FILE') && file(project.property('W3D_SUBIDA_STORE_FILE')).exists()

// Las mismas ABIs que compila jni/Application.mk (no 'x86': no se genera .so).
// Una sola fuente de verdad: se usan para abiFilters Y para el nombre del APK, asi
// el nombre siempre lista las arquitecturas que este APK universal (fat) trae dentro.
def supportedAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']

android {
    // 36 = Android 16: Google Play lo pide para apps nuevas y actualizaciones desde el 31/08/2026. Desde la 35 la
    // ventana va de borde a borde (Whisk3DActivity le da el margen de las barras, del notch y del teclado)
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.whisk3d"
        minSdkVersion paraPlay ? 24 : 21
        targetSdkVersion 36
        versionCode buildCode
        versionName buildDate
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters(*supportedAbis)
        }
    }
    signingConfigs {
        if (hayClaveSubida) {
            subida {
                storeFile file(project.property('W3D_SUBIDA_STORE_FILE'))
                storePassword project.property('W3D_SUBIDA_STORE_PASSWORD')
                keyAlias project.property('W3D_SUBIDA_KEY_ALIAS')
                keyPassword project.property('W3D_SUBIDA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // R8: achica, optimiza y ofusca el Java del AAB (Play lo mide como "optimizacion de codigo DEX"; con
            // minifyEnabled false salia "baja"). 'proguard-android-optimize.txt' y no 'proguard-android.txt': esa
            // trae -dontoptimize. Lo que el C/C++ llama por JNI se guarda en proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // el AAB para Google Play (./gradlew bundleRelease): con la clave de subida. Sin ella, la de debug
            // (~/.android/debug.keystore, AGP la crea/usa sola). El APK de la pagina sigue siendo el de assembleDebug.
            signingConfig hayClaveSubida ? signingConfigs.subida : signingConfigs.debug
        }
    }
    namespace 'com.whisk3d'

    // UN solo APK universal (fat), ya firmado y con nombre que lista las 3 ABIs que
    // trae adentro: whisk3d-editor-<fecha>-arm64-v8a_armeabi-v7a_x86_64.apk
    // (antes salian dos: el -unsigned de gradle + el firmado a mano).
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "whisk3d-editor-${buildDate}-${supportedAbis.join('_')}.apk"
        }
    }
}
// SIN androidx: SDLActivity extiende la Activity de Android y el tema es el del sistema (styles.xml). appcompat 1.1.0
// solo ponia el padre del tema y traia fragment 1.1.0, activity 1.0.0, core, lifecycle... que Google Play marca como
// versiones obsoletas. Si algun dia hace falta una libreria androidx, que sea una version actual.
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
